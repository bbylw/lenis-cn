<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面不存在 · Lenis 中文站</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: oklch(0.163 0.005 264);
        --fg: oklch(0.962 0.003 264);
        --muted: oklch(0.712 0.014 264);
        --card: oklch(0.208 0.006 264);
        --border: oklch(1 0 0 / 11%);
        --brand: oklch(0.705 0.165 27);
        --brand-fg: oklch(0.17 0.03 27);
        --brand-soft: oklch(0.705 0.165 27 / 0.12);
        --brand-line: oklch(0.705 0.165 27 / 0.26);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: oklch(0.985 0.002 264);
          --fg: oklch(0.175 0.005 264);
          --muted: oklch(0.535 0.014 264);
          --card: oklch(0.995 0.001 264);
          --border: oklch(0.905 0.004 264);
          --brand: oklch(0.52 0.185 27);
          --brand-fg: oklch(0.99 0.002 27);
          --brand-soft: oklch(0.52 0.185 27 / 0.08);
          --brand-line: oklch(0.52 0.185 27 / 0.22);
          color-scheme: light;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        font-family: "Geist Variable", ui-sans-serif, system-ui, "PingFang SC",
          "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 540px;
        padding: 44px 40px 40px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
      }
      /* 四角技术折角，呼应站内工程 HUD */
      .corner {
        position: absolute;
        width: 16px;
        height: 16px;
        border-color: var(--brand);
        border-style: solid;
        border-width: 0;
      }
      .corner.tl { top: 12px; left: 12px; border-top-width: 2px; border-left-width: 2px; }
      .corner.tr { top: 12px; right: 12px; border-top-width: 2px; border-right-width: 2px; }
      .corner.bl { bottom: 12px; left: 12px; border-bottom-width: 2px; border-left-width: 2px; }
      .corner.br { bottom: 12px; right: 12px; border-bottom-width: 2px; border-right-width: 2px; }
      .eyebrow {
        display: inline-block;
        font-family: "Geist Mono Variable", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand);
        padding: 4px 10px;
        border: 1px solid var(--brand-line);
        border-radius: 6px;
        background: var(--brand-soft);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 26px;
      }
      .mark svg { width: 30px; height: 30px; border-radius: 8px; display: block; }
      .mark .wordmark { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      .mark .tag {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
      }
      h1 {
        margin-top: 22px;
        font-size: 26px;
        line-height: 1.3;
        font-weight: 600;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      p.lead {
        margin-top: 14px;
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 44ch;
      }
      .actions {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 42px;
        padding: 0 20px;
        border-radius: 9px;
        font-size: 15px;
        text-decoration: none;
        transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
      }
      a.btn:active { transform: translateY(1px); }
      a.btn.primary {
        background: var(--brand);
        color: var(--brand-fg);
      }
      a.btn.primary:hover { filter: brightness(1.06); }
      a.btn.ghost {
        border: 1px solid var(--border);
        color: var(--fg);
      }
      a.btn.ghost:hover { border-color: var(--brand-line); color: var(--brand); }
      .foot {
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 420px) {
        .card { padding: 34px 24px 28px; }
        h1 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <span class="eyebrow">:: 404 // Out of Viewport ::</span>

      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#C93A21" />
          <g fill="#FFF5F2">
            <rect x="8" y="10" width="16" height="2.4" rx="1.2" />
            <rect x="8" y="14.8" width="11" height="2.4" rx="1.2" />
            <rect x="8" y="19.6" width="6" height="2.4" rx="1.2" />
          </g>
        </svg>
        <span class="wordmark">Lenis</span>
        <span class="tag">中文</span>
      </div>

      <h1>这一页没有落在滚动范围内。</h1>
      <p class="lead">
        你访问的地址可能已经失效或拼错了。回到首页，从顶部顺滑地滚一遍就是。
      </p>

      <div class="actions">
        <a class="btn primary" href="/">返回首页</a>
        <a
          class="btn ghost"
          href="https://github.com/darkroomengineering/lenis"
          target="_blank"
          rel="noreferrer noopener"
        >查看 GitHub</a>
      </div>

      <p class="foot">
        本站是 Lenis 官方文档的中文整理与演示，非官方站点，内容以原仓库为准。
      </p>
    </main>
  </body>
</html>
